<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>富能量吸取器 · 玄學靈氣採集陣</title>
<style>
  :root{
    --bg:#06070d;
    --ink:#e9e3d4;
    --ink-dim:#9a9382;
    --gold:#d8b46a;
    --line:rgba(216,180,106,.28);
    --panel:rgba(10,12,20,.62);
    --metal:#f0e6c8;
    --wood:#6ce6a2;
    --water:#59c6ff;
    --fire:#ff6f61;
    --earth:#f3b73f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Serif TC","Songti TC","Source Han Serif TC",Georgia,"PingFang TC","Microsoft JhengHei",serif;
    overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  canvas#field{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:fixed;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 14px 14px}
  .title{
    position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;
  }
  .title h1{margin:0;font-size:clamp(15px,3.4vw,20px);letter-spacing:.42em;font-weight:500;color:var(--gold);text-indent:.42em}
  .title p{margin:6px 0 0;font-size:11px;letter-spacing:.28em;color:var(--ink-dim);text-indent:.28em}

  /* 左側：五行儀表 */
  .gauge{
    position:absolute;left:14px;top:96px;width:min(210px,42vw);
    background:var(--panel);border:1px solid var(--line);border-radius:2px;
    padding:12px 12px 10px;backdrop-filter:blur(6px);
  }
  .gauge h2{margin:0 0 10px;font-size:11px;letter-spacing:.3em;color:var(--ink-dim);font-weight:400}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .row .cn{width:1.2em;font-size:13px;text-align:center;flex:none}
  .bar{flex:1;height:4px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;transition:width .18s linear;display:block}
  .row .num{width:3.4em;text-align:right;font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}

  .total{margin-top:12px;padding-top:10px;border-top:1px solid rgba(216,180,106,.16)}
  .total .big{font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
  .total .lbl{font-size:10px;letter-spacing:.3em;color:var(--ink-dim);margin-bottom:2px}
  .stage{margin-top:8px;font-size:12px;letter-spacing:.2em;color:var(--ink)}
  .stage small{color:var(--ink-dim);letter-spacing:.1em}

  /* 熱度（走火入魔） */
  .heat{margin-top:10px}
  .heat .lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--ink-dim);margin-bottom:4px}
  .heat .bar{height:3px}
  .heat i{background:linear-gradient(90deg,#4a7fae,#f3b73f 60%,#ff5340)}
  .heat.hot .lbl{color:#ff8a7a}

  /* 底部提示與按鈕 */
  .foot{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center}
  .foot .tip{font-size:11px;letter-spacing:.2em;color:var(--ink-dim);margin-bottom:10px;min-height:1.2em}
  .btn{
    pointer-events:auto;cursor:pointer;display:inline-block;
    background:transparent;color:var(--gold);border:1px solid var(--line);
    padding:9px 20px;font-size:12px;letter-spacing:.3em;text-indent:.3em;
    font-family:inherit;border-radius:2px;transition:.18s;
  }
  .btn:hover{background:rgba(216,180,106,.1);border-color:rgba(216,180,106,.55)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.35;cursor:default}

  /* 遮罩對話框 */
  .veil{
    position:fixed;inset:0;z-index:10;display:none;place-items:center;
    background:radial-gradient(120% 90% at 50% 40%,rgba(8,10,18,.86),rgba(3,4,8,.97));
    padding:20px;overflow:auto;
  }
  .veil.on{display:grid}
  .card{
    width:min(440px,100%);background:rgba(9,11,19,.92);border:1px solid var(--line);
    border-radius:3px;padding:26px 24px;box-shadow:0 0 80px rgba(216,180,106,.07);
  }
  .card h2{margin:0 0 4px;font-size:16px;letter-spacing:.34em;color:var(--gold);text-indent:.34em;text-align:center;font-weight:500}
  .card .sub{margin:0 0 20px;text-align:center;font-size:11px;letter-spacing:.24em;color:var(--ink-dim);text-indent:.24em}
  label{display:block;font-size:11px;letter-spacing:.24em;color:var(--ink-dim);margin:14px 0 6px}
  input{
    width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(216,180,106,.2);
    color:var(--ink);font-family:inherit;font-size:14px;padding:9px 11px;border-radius:2px;outline:none;
  }
  input:focus{border-color:rgba(216,180,106,.6)}
  .card .go{width:100%;margin-top:22px;padding:12px}
  .fine{margin-top:16px;font-size:10px;line-height:1.8;color:#5f5a4e;text-align:center;letter-spacing:.1em}

  /* 報告 */
  .verdict{text-align:center;margin:6px 0 18px}
  .verdict .elem{font-size:56px;line-height:1;color:var(--gold);text-shadow:0 0 30px currentColor}
  .verdict .name{margin-top:10px;font-size:13px;letter-spacing:.3em;text-indent:.3em}
  .verdict .name b{color:var(--gold);font-weight:500}
  .dist{display:flex;height:6px;margin:18px 0 6px;overflow:hidden;border-radius:2px}
  .dist span{display:block;height:100%}
  .distkey{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-dim);letter-spacing:.1em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(216,180,106,.16);border:1px solid rgba(216,180,106,.16);margin:20px 0 4px}
  .cell{background:#0a0c14;padding:12px 12px 11px}
  .cell .k{font-size:10px;letter-spacing:.24em;color:var(--ink-dim)}
  .cell .v{margin-top:5px;font-size:15px;color:var(--ink)}
  .poem{margin:20px 0 0;padding:14px 0;border-top:1px solid rgba(216,180,106,.16);border-bottom:1px solid rgba(216,180,106,.16);text-align:center;font-size:14px;letter-spacing:.22em;text-indent:.22em;color:var(--gold);line-height:2}
  .advice{margin:16px 0 0;font-size:12px;line-height:2;color:var(--ink-dim);letter-spacing:.06em}
  .advice b{color:var(--ink);font-weight:500}
  .cta{display:flex;gap:10px;margin-top:22px}
  .cta .btn{flex:1;text-align:center}
</style>
</head>
<body>

<canvas id="field"></canvas>

<div class="hud">
  <div class="title">
    <h1>富能量吸取器</h1>
    <p>五行靈氣採集陣 · 玄之又玄</p>
  </div>

  <div class="gauge" id="gauge">
    <h2>五行納氣</h2>
    <div id="rows"></div>
    <div class="total">
      <div class="lbl">總能量</div>
      <div class="big" id="total">0</div>
      <div class="stage" id="stage">練氣 <small>· 一層</small></div>
    </div>
    <div class="heat" id="heatBox">
      <div class="lbl"><span id="heatLbl">心火</span><span id="heatPct">0%</span></div>
      <div class="bar"><i id="heatBar"></i></div>
    </div>
  </div>

  <div class="foot">
    <div class="tip" id="tip">按住畫面（或長按空白鍵）催動吸取陣</div>
    <button class="btn" id="finish">收 功 結 印</button>
  </div>
</div>

<!-- 開光 -->
<div class="veil on" id="setup">
  <div class="card">
    <h2>開 光</h2>
    <p class="sub">先報上名來，方能校準你的本命靈頻</p>
    <label>姓名 / 道號</label>
    <input id="inName" maxlength="16" placeholder="無名氏亦可" autocomplete="off">
    <label>生辰（年-月-日）</label>
    <input id="inBirth" type="date">
    <button class="btn go" id="start">起 陣</button>
    <p class="fine">本器械純屬娛樂，不構成任何醫療、投資或人生建議。<br>吸取過猛恐致走火入魔，請自行斟酌。</p>
  </div>
</div>

<!-- 能量報告 -->
<div class="veil" id="report">
  <div class="card" id="reportCard"></div>
</div>

<script>
(() => {
'use strict';

/* ────────── 五行 ────────── */
const ELEMENTS = [
  { key:'metal', cn:'金', color:'#f0e6c8', dir:'西',   colorName:'素白 · 鎏金', num:7, organ:'肺' },
  { key:'wood',  cn:'木', color:'#6ce6a2', dir:'東',   colorName:'青翠 · 松綠', num:3, organ:'肝' },
  { key:'water', cn:'水', color:'#59c6ff', dir:'北',   colorName:'玄黑 · 深藍', num:1, organ:'腎' },
  { key:'fire',  cn:'火', color:'#ff6f61', dir:'南',   colorName:'赤紅 · 朱橘', num:9, organ:'心' },
  { key:'earth', cn:'土', color:'#f3b73f', dir:'中宮', colorName:'土黃 · 米褐', num:5, organ:'脾' },
];
const IDX = Object.fromEntries(ELEMENTS.map((e,i)=>[e.key,i]));
// 相生：木→火→土→金→水→木
const SHENG = { wood:'fire', fire:'earth', earth:'metal', metal:'water', water:'wood' };
// 相剋：木→土→水→火→金→木
const KE    = { wood:'earth', earth:'water', water:'fire', fire:'metal', metal:'wood' };
const BY = k => ELEMENTS[IDX[k]];
const SHICHEN = ['子時 23–01','丑時 01–03','寅時 03–05','卯時 05–07','辰時 07–09','巳時 09–11',
                 '午時 11–13','未時 13–15','申時 15–17','酉時 17–19','戌時 19–21','亥時 21–23'];
const TRIGRAMS = ['☰','☱','☲','☳','☴','☵','☶','☷'];
const STAGES = [
  [0,'練氣'],[500,'築基'],[1400,'金丹'],[3000,'元嬰'],[5500,'化神'],[9000,'渡劫'],[14000,'大乘'],
];
const POEMS = [
  '雲開見月明，靈台自在清',
  '一氣化三清，萬象歸於寧',
  '風起於青萍，勢成於九霄',
  '心若冰清，天塌不驚',
  '道法自然，水到渠成',
  '藏鋒守拙，厚積薄發',
  '山高自有客行路，水深自有渡船人',
  '静水流深，滄笙踏歌',
  '既來之，則安之，靈氣自來',
  '天行有常，不為堯存',
  '莫聽穿林打葉聲，何妨吟嘯且徐行',
  '柳暗花明，別有洞天',
];

/* ────────── 種子亂數（讓同一人同一天結果穩定） ────────── */
function hashStr(s){
  let h = 2166136261 >>> 0;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ────────── 狀態 ────────── */
const cv = document.getElementById('field');
const ctx = cv.getContext('2d', { alpha:false });
let W=0, H=0, DPR=1;

const S = {
  running:false,
  seed:0, rnd:Math.random,
  natal:'earth',          // 本命五行（影響靈氣分佈）
  weights:[1,1,1,1,1],
  tally:[0,0,0,0,0],
  total:0,
  heat:0, overheated:false, overUntil:0,
  absorbing:false,
  px:0, py:0, hasPointer:false,
  spin:0, corePulse:0,
  particles:[], sparks:[],
  t:0, startedAt:0,
};

/* ────────── 粒子貼圖（預先算好，省 shadowBlur） ────────── */
const SPRITE = {};
function makeSprites(){
  for (const e of ELEMENTS) SPRITE[e.key] = sprite(e.color);
  SPRITE.origin = sprite('#ffe6a8');
}
function sprite(color){
  const s = 48, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grad.addColorStop(0,   color);
  grad.addColorStop(.22, color);
  grad.addColorStop(.5,  hexA(color,.45));
  grad.addColorStop(1,   hexA(color,0));
  g.fillStyle = grad; g.fillRect(0,0,s,s);
  return c;
}
function hexA(hex,a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ────────── 版面 ────────── */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#06070d'; ctx.fillRect(0,0,W,H);
  if (!S.hasPointer){ S.px = W/2; S.py = H/2; }
}
window.addEventListener('resize', resize);

/* ────────── 靈氣粒子 ────────── */
const PULL_R = 250;      // 吸取場半徑
const CORE_R = 34;       // 陣心半徑
const MAX_HEAT = 100;

function targetCount(){ return Math.round(Math.min(260, (W*H)/6200)); }

function spawnParticle(fromEdge){
  const r = S.rnd();
  let acc = 0, ei = 4, sum = S.weights.reduce((a,b)=>a+b,0);
  for (let i=0;i<5;i++){ acc += S.weights[i]/sum; if (r <= acc){ ei = i; break; } }
  const rare = S.rnd() < 0.018;                  // 天地元氣
  let x, y;
  if (fromEdge){
    const side = (S.rnd()*4)|0;
    if (side===0){ x = -20; y = S.rnd()*H; }
    else if (side===1){ x = W+20; y = S.rnd()*H; }
    else if (side===2){ x = S.rnd()*W; y = -20; }
    else { x = S.rnd()*W; y = H+20; }
  } else { x = S.rnd()*W; y = S.rnd()*H; }
  const ang = S.rnd()*Math.PI*2;
  const sp = 6 + S.rnd()*16;
  return {
    e: ei, x, y,
    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
    r: rare ? 5.5 + S.rnd()*2 : 1.4 + S.rnd()*2.4,
    rare,
    ph: S.rnd()*Math.PI*2,
  };
}
function seedField(){
  S.particles.length = 0;
  const n = targetCount();
  for (let i=0;i<n;i++) S.particles.push(spawnParticle(false));
}

function addSpark(x,y,color){
  const a = S.rnd()*Math.PI*2, sp = 40 + S.rnd()*90;
  S.sparks.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color });
}

/* ────────── 每幀更新 ────────── */
function update(dt){
  S.t += dt;
  S.spin += dt * (S.absorbing ? 1.5 : 0.4);
  S.corePulse = Math.max(0, S.corePulse - dt*3.2);

  // 心火（過熱）機制
  if (S.overheated){
    if (S.t >= S.overUntil){ S.overheated = false; S.heat = 42; setTip('心息已平，可續吸取'); }
    S.heat = Math.max(0, S.heat - dt*28);
  } else if (S.absorbing){
    S.heat += dt*17;
    if (S.heat >= MAX_HEAT){
      S.heat = MAX_HEAT; S.overheated = true; S.overUntil = S.t + 3;
      S.absorbing = false;
      setTip('走火入魔！靜心三息…');
      for (let i=0;i<26;i++) addSpark(S.px, S.py, '#ff5340');
    }
  } else {
    S.heat = Math.max(0, S.heat - dt*22);
  }

  const pulling = S.absorbing && !S.overheated && S.hasPointer;
  // 靈氣濃度隨呼吸起伏
  const density = 0.75 + 0.25*Math.sin(S.t*0.45);

  for (let i=S.particles.length-1;i>=0;i--){
    const p = S.particles[i];
    if (pulling){
      const dx = S.px - p.x, dy = S.py - p.y;
      const d2 = dx*dx + dy*dy, d = Math.sqrt(d2) || 1;
      if (d < PULL_R){
        const pull = 18000000 / Math.max(d2, 900);          // 近距離加速衝入
        const falloff = 1 - (d/PULL_R)*0.35;
        p.vx += (dx/d) * pull * falloff * dt;
        p.vy += (dy/d) * pull * falloff * dt;
        // 一點切線力，形成漩渦
        p.vx += (-dy/d) * pull * 0.16 * dt;
        p.vy += ( dx/d) * pull * 0.16 * dt;
      } else {
        // 遠場牽引：滿屏靈氣緩緩匯流而來，陣不會吸乾
        p.vx += (dx/d) * 190 * dt;
        p.vy += (dy/d) * 190 * dt;
      }
      if (d < CORE_R){                                    // 入陣
        const gain = (p.rare ? 12 : 1) * (0.6 + p.r*0.28);
        S.tally[p.e] += gain; S.total += gain;
        S.corePulse = Math.min(1, S.corePulse + (p.rare ? 0.9 : 0.22));
        const col = p.rare ? '#ffe6a8' : ELEMENTS[p.e].color;
        for (let k=0;k<(p.rare?14:3);k++) addSpark(S.px, S.py, col);
        if (p.rare) setTip('得天地元氣一縷 ✦');
        S.particles[i] = spawnParticle(true);
        continue;
      }
    }
    // 靈氣自身的游離擾動
    p.vx += (S.rnd()-0.5)*22*dt;
    p.vy += (S.rnd()-0.5)*22*dt;
    p.vx *= (1 - 0.9*dt); p.vy *= (1 - 0.9*dt);
    const sp2 = p.vx*p.vx + p.vy*p.vy, CAP = 900;      // 限速，避免高速穿陣而過
    if (sp2 > CAP*CAP){ const k = CAP/Math.sqrt(sp2); p.vx *= k; p.vy *= k; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.ph += dt*2.4;
    const m = 40;
    if (p.x < -m || p.x > W+m || p.y < -m || p.y > H+m) S.particles[i] = spawnParticle(true);
  }

  // 維持粒子數（受靈氣濃度影響）
  const want = Math.round(targetCount()*density);
  if (S.particles.length < want) S.particles.push(spawnParticle(true));
  else if (S.particles.length > want + 20) S.particles.pop();

  for (let i=S.sparks.length-1;i>=0;i--){
    const s = S.sparks[i];
    s.x += s.vx*dt; s.y += s.vy*dt;
    s.vx *= (1-2.6*dt); s.vy *= (1-2.6*dt);
    s.life -= dt*1.9;
    if (s.life <= 0) S.sparks.splice(i,1);
  }
}

/* ────────── 繪製 ────────── */
function draw(){
  // 拖尾殘影
  ctx.fillStyle = 'rgba(6,7,13,0.30)';
  ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation = 'lighter';

  for (const p of S.particles){
    const img = p.rare ? SPRITE.origin : SPRITE[ELEMENTS[p.e].key];
    const tw = p.r * (p.rare ? 9 : 7) * (0.85 + 0.15*Math.sin(p.ph));
    ctx.globalAlpha = p.rare ? 0.95 : 0.62;
    ctx.drawImage(img, p.x - tw/2, p.y - tw/2, tw, tw);
  }
  for (const s of S.sparks){
    ctx.globalAlpha = Math.max(0, s.life)*0.85;
    const w = 9*s.life + 2;
    ctx.drawImage(SPRITE.origin, s.x-w/2, s.y-w/2, w, w);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  if (S.running && S.hasPointer) drawArray();
}

function drawArray(){
  const x = S.px, y = S.py;
  const hot = S.overheated;
  const live = S.absorbing && !hot;
  const accent = hot ? '#ff5340' : '#d8b46a';

  ctx.save();
  ctx.translate(x,y);

  // 吸取場範圍
  ctx.beginPath();
  ctx.arc(0,0,PULL_R,0,Math.PI*2);
  ctx.strokeStyle = hexA(accent, live ? 0.16 : 0.07);
  ctx.lineWidth = 1; ctx.stroke();

  // 八卦環
  const ringR = 64 + (live ? 5*Math.sin(S.t*6) : 0);
  ctx.rotate(S.spin*0.5);
  ctx.beginPath(); ctx.arc(0,0,ringR,0,Math.PI*2);
  ctx.strokeStyle = hexA(accent, live ? 0.55 : 0.25); ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,ringR-9,0,Math.PI*2);
  ctx.strokeStyle = hexA(accent, live ? 0.22 : 0.1); ctx.stroke();

  ctx.font = '15px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = hexA(accent, live ? 0.85 : 0.4);
  for (let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2;
    ctx.save();
    ctx.translate(Math.cos(a)*(ringR+16), Math.sin(a)*(ringR+16));
    ctx.rotate(a + Math.PI/2);
    ctx.fillText(TRIGRAMS[i], 0, 0);
    ctx.restore();
  }

  // 內圈符線
  ctx.rotate(-S.spin*1.4);
  ctx.beginPath();
  for (let i=0;i<6;i++){
    const a = (i/6)*Math.PI*2;
    ctx.moveTo(Math.cos(a)*CORE_R, Math.sin(a)*CORE_R);
    ctx.lineTo(Math.cos(a+Math.PI*2/3)*CORE_R, Math.sin(a+Math.PI*2/3)*CORE_R);
  }
  ctx.strokeStyle = hexA(accent, live ? 0.4 : 0.16); ctx.stroke();
  ctx.restore();

  // 陣心
  const pulse = 1 + S.corePulse*0.55;
  ctx.save(); ctx.translate(x,y);
  ctx.globalCompositeOperation = 'lighter';
  const cr = CORE_R*pulse*2.6;
  ctx.globalAlpha = live ? 0.9 : 0.35;
  ctx.drawImage(SPRITE.origin, -cr/2, -cr/2, cr, cr);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath(); ctx.arc(0,0,CORE_R*0.42*pulse,0,Math.PI*2);
  ctx.fillStyle = hot ? '#ff5340' : '#fff3d6'; ctx.fill();
  ctx.restore();
}

/* ────────── HUD ────────── */
const rowsEl = document.getElementById('rows');
const bars = [];
ELEMENTS.forEach(e => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<span class="cn" style="color:${e.color}">${e.cn}</span>
                   <span class="bar"><i style="background:${e.color}"></i></span>
                   <span class="num">0</span>`;
  rowsEl.appendChild(row);
  bars.push({ fill: row.querySelector('i'), num: row.querySelector('.num') });
});
const elTotal = document.getElementById('total');
const elStage = document.getElementById('stage');
const elHeatBar = document.getElementById('heatBar');
const elHeatPct = document.getElementById('heatPct');
const elHeatLbl = document.getElementById('heatLbl');
const elHeatBox = document.getElementById('heatBox');
const elTip = document.getElementById('tip');
let tipUntil = 0;
function setTip(msg, hold=2.2){ elTip.textContent = msg; tipUntil = S.t + hold; }

function stageOf(total){
  let name = STAGES[0][1], base = 0, next = STAGES[1][0];
  for (let i=0;i<STAGES.length;i++){
    if (total >= STAGES[i][0]){ name = STAGES[i][1]; base = STAGES[i][0]; next = STAGES[i+1] ? STAGES[i+1][0] : Infinity; }
  }
  const layer = next === Infinity ? 9 : Math.min(9, 1 + Math.floor((total-base)/((next-base)/9)));
  return { name, layer, next };
}
const CN_NUM = ['','一','二','三','四','五','六','七','八','九'];

function syncHUD(){
  const max = Math.max(1, ...S.tally);
  for (let i=0;i<5;i++){
    bars[i].fill.style.width = (S.tally[i]/max*100) + '%';
    bars[i].num.textContent = Math.round(S.tally[i]);
  }
  elTotal.textContent = Math.round(S.total).toLocaleString('en-US');
  const st = stageOf(S.total);
  elStage.innerHTML = `${st.name} <small>· ${CN_NUM[st.layer]}層</small>`;
  const hp = Math.round(S.heat);
  elHeatBar.style.width = hp + '%';
  elHeatPct.textContent = hp + '%';
  elHeatBox.classList.toggle('hot', S.overheated || hp > 78);
  elHeatLbl.textContent = S.overheated ? '走火入魔' : '心火';
  if (S.t > tipUntil){
    elTip.textContent = S.absorbing ? '靈氣入體，穩住…' : '按住畫面（或長按空白鍵）催動吸取陣';
  }
}

/* ────────── 輸入 ────────── */
function setPointer(e){
  const t = e.touches ? e.touches[0] : e;
  S.px = t.clientX; S.py = t.clientY; S.hasPointer = true;
}
cv.addEventListener('pointerdown', e => { setPointer(e); S.absorbing = true; cv.setPointerCapture?.(e.pointerId); });
cv.addEventListener('pointermove', setPointer);
window.addEventListener('pointerup',    () => S.absorbing = false);
window.addEventListener('pointercancel',() => S.absorbing = false);
cv.addEventListener('pointerenter', setPointer);
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && S.running && !e.repeat){ e.preventDefault(); S.hasPointer = true; S.absorbing = true; }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') S.absorbing = false; });
window.addEventListener('blur', () => S.absorbing = false);

/* ────────── 開光 ────────── */
const setupVeil = document.getElementById('setup');
const inName = document.getElementById('inName');
const inBirth = document.getElementById('inBirth');

function ignite(){
  const name = (inName.value.trim() || '無名氏');
  const birth = inBirth.value || '';
  const today = new Date().toISOString().slice(0,10);
  S.seed = hashStr(name + '|' + birth + '|' + today);
  S.rnd = mulberry32(S.seed);
  S.natal = ELEMENTS[S.seed % 5].key;
  S.profile = { name, birth, today };

  // 本命五行靈氣較盛，被剋者較稀
  const natal = S.natal, weak = KE[natal];
  S.weights = ELEMENTS.map(e => e.key === natal ? 2.1 : e.key === weak ? 0.55 : 1);

  S.tally = [0,0,0,0,0]; S.total = 0; S.heat = 0; S.overheated = false;
  S.startedAt = S.t;
  seedField();
  S.running = true;
  setupVeil.classList.remove('on');
  setTip(`${name}，本命屬${BY(natal).cn}，${BY(natal).dir}方靈氣最盛`, 4.5);
}
document.getElementById('start').addEventListener('click', ignite);
[inName, inBirth].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') ignite(); }));

/* ────────── 收功結印 · 能量報告 ────────── */
const reportVeil = document.getElementById('report');
const reportCard = document.getElementById('reportCard');

function makeReport(){
  const sum = S.total || 1;
  const pct = S.tally.map(v => v/sum);
  let hi = 0, lo = 0;
  for (let i=1;i<5;i++){ if (S.tally[i] > S.tally[hi]) hi = i; if (S.tally[i] < S.tally[lo]) lo = i; }
  const dom = ELEMENTS[hi], weak = ELEMENTS[lo];
  const mean = 0.2;
  const dev = Math.sqrt(pct.reduce((a,p)=>a+(p-mean)**2,0)/5);
  const balance = Math.max(0, Math.min(100, Math.round((1 - dev/0.35)*100)));
  const st = stageOf(S.total);
  const rnd = mulberry32(S.seed ^ Math.round(S.total));
  const poem = POEMS[Math.floor(rnd()*POEMS.length)];
  const shi = SHICHEN[Math.floor(rnd()*SHICHEN.length)];
  const remedy = BY(Object.keys(SHENG).find(k => SHENG[k] === weak.key));  // 生「最弱者」的那一行
  const secs = Math.max(1, Math.round(S.t - S.startedAt));
  const rate = (S.total/secs).toFixed(1);
  return { dom, weak, remedy, balance, st, poem, shi, pct, secs, rate };
}

function showReport(){
  if (!S.running) return;
  const r = makeReport();
  const name = S.profile?.name || '無名氏';
  const distBars = ELEMENTS.map((e,i) =>
    `<span style="background:${e.color};width:${Math.max(0.6, r.pct[i]*100)}%"></span>`).join('');
  const distKey = ELEMENTS.map((e,i) =>
    `<span style="color:${e.color}">${e.cn} ${Math.round(r.pct[i]*100)}%</span>`).join('');

  reportCard.innerHTML = `
    <h2>能 量 報 告</h2>
    <p class="sub">${name} · ${S.profile?.today || ''}</p>
    <div class="verdict">
      <div class="elem" style="color:${r.dom.color}">${r.dom.cn}</div>
      <div class="name">主導靈氣 · <b>${r.st.name}${CN_NUM[r.st.layer]}層</b></div>
    </div>
    <div class="dist">${distBars}</div>
    <div class="distkey">${distKey}</div>
    <div class="grid">
      <div class="cell"><div class="k">開運色</div><div class="v">${r.dom.colorName}</div></div>
      <div class="cell"><div class="k">吉位</div><div class="v">${r.dom.dir}方</div></div>
      <div class="cell"><div class="k">旺時</div><div class="v">${r.shi}</div></div>
      <div class="cell"><div class="k">幸運數</div><div class="v">${r.dom.num}</div></div>
      <div class="cell"><div class="k">五行平衡</div><div class="v">${r.balance} 分</div></div>
      <div class="cell"><div class="k">納氣效率</div><div class="v">${r.rate} / 秒</div></div>
    </div>
    <p class="poem">${r.poem}</p>
    <p class="advice">
      本輪共納靈氣 <b>${Math.round(S.total).toLocaleString('en-US')}</b> 縷，歷時 <b>${r.secs}</b> 秒。<br>
      ${r.dom.cn}氣獨盛，宜守 <b>${r.dom.dir}方</b>、多用 <b>${r.dom.colorName}</b>，養 <b>${r.dom.organ}</b>。<br>
      ${r.weak.cn}氣偏虛，可借 <b>${r.remedy.cn}</b> 以生之——親近 <b>${r.remedy.colorName}</b> 之物、常往 <b>${r.remedy.dir}方</b> 走動。<br>
      ${r.balance >= 70 ? '五行調和，氣機圓融，宜靜守勿貪。' : '五行偏枯，下輪可換方位吸取，補其不足。'}
    </p>
    <div class="cta">
      <button class="btn" id="again">再 吸 一 輪</button>
      <button class="btn" id="close">收 好</button>
    </div>
    <p class="fine">本報告由靈氣分佈與生辰種子推算，純屬娛樂。</p>
  `;
  reportVeil.classList.add('on');
  S.absorbing = false;
  document.getElementById('again').onclick = () => {
    reportVeil.classList.remove('on');
    S.tally = [0,0,0,0,0]; S.total = 0; S.heat = 0; S.overheated = false; S.startedAt = S.t;
    seedField(); setTip('重起爐灶，再納一輪', 2.5);
  };
  document.getElementById('close').onclick = () => reportVeil.classList.remove('on');
}
document.getElementById('finish').addEventListener('click', showReport);

/* ────────── 主迴圈 ────────── */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  update(dt);
  draw();
  syncHUD();
  requestAnimationFrame(frame);
}

makeSprites();
resize();
seedField();
inBirth.value = '';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
