<script>
(function(){
"use strict";
/* ==========================================================================
   0. 常數與工具
   ========================================================================== */
var PB=0.458597, PP=0.446247, PT=0.095156;
var PBnt = PB/(PB+PP);                 // 0.50682 — 除去和局後莊的機率
var EDGE_B=-0.0106, EDGE_P=-0.0124;
var MAXROW=6, DECKS=8, CUT=14;

var $=function(s){return document.querySelector(s);};
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var pct=function(v,d){return (v*100).toFixed(d===undefined?1:d)+'%';};
var other=function(r){return r==='B'?'P':'B';};

var toastEl=$('#toast'), toastT=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('on');},1700);
}

/* ==========================================================================
   1. 狀態
   ========================================================================== */
var STORE='bacc.road.v1';
var state={hands:[], shoe:1, pendB:false, pendP:false};
var ghost=[];   // 推演出來的續走（不存檔）

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({hands:state.hands, shoe:state.shoe})); }catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem(STORE); if(!raw) return;
    var o=JSON.parse(raw);
    if(o && Array.isArray(o.hands)){ state.hands=o.hands; state.shoe=o.shoe||1; }
  }catch(e){}
}
function loadPrefs(){
  try{
    var t=localStorage.getItem('bacc.theme'); if(t&&t!=='auto'){ document.documentElement.dataset.theme=t; $('#themeSel').value=t; }
    var c=localStorage.getItem('bacc.cell'); if(c){ document.documentElement.style.setProperty('--cell',c+'px'); $('#cellSel').value=c; }
  }catch(e){}
}

/* ==========================================================================
   2. 路單結構
   ========================================================================== */
// 由 hands 產生大路的「邏輯列」與每一顆的資料
function bigRoadData(hands){
  var runs=[], runRes=[], cells=[], pending=0;
  for(var i=0;i<hands.length;i++){
    var h=hands[i];
    if(h.r==='T'){
      if(cells.length) cells[cells.length-1].ties++;
      else pending++;
      continue;
    }
    if(runs.length && runRes[runs.length-1]===h.r) runs[runs.length-1]++;
    else { runs.push(1); runRes.push(h.r); }
    var cell={k:h.r, ties:0, bp:!!h.bp, pp:!!h.pp, ghost:!!h.ghost};
    if(pending){ cell.ties+=pending; pending=0; }
    cells.push(cell);
  }
  return {runs:runs, runRes:runRes, cells:cells};
}

// 通用排版：往下走，走到底或被擋就往右拖尾
function place(items){
  var occ={}, out=[], maxCol=-1, col=0, row=0, prev=null;
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(prev===null){ col=0; row=0; }
    else if(it.k===prev){
      if(row+1<MAXROW && !occ[col+','+(row+1)]) row++;
      else { var c=col+1; while(occ[c+','+row]) c++; col=c; }
    } else { col=maxCol+1; row=0; }
    occ[col+','+row]=1;
    var m={}; for(var q in it) m[q]=it[q];
    m.col=col; m.row=row; out.push(m);
    if(col>maxCol) maxCol=col;
    prev=it.k;
  }
  return {marks:out, cols:maxCol+1};
}

// 下三路單點判定：'B'=紅（整齊）、'P'=藍（不齊）
function derivedAt(cols,c,r,k){
  if(r===0){
    if(c-k-1<0) return null;
    return cols[c-k-1]===cols[c-k] ? 'B' : 'P';
  }
  if(c-k<0) return null;
  var L=cols[c-k];
  return (L>=r+1 || L<r) ? 'B' : 'P';
}
function derivedRoad(cols,k){
  var out=[];
  for(var c=0;c<cols.length;c++) for(var r=0;r<cols[c];r++){
    var v=derivedAt(cols,c,r,k);
    if(v) out.push({k:v});
  }
  return out;
}
// 假設下一局開 cand，回傳三條下三路的新點顏色
function askRoads(cols,runRes,cand){
  var nc=cols.slice();
  if(nc.length && runRes[runRes.length-1]===cand) nc[nc.length-1]++;
  else nc.push(1);
  var c=nc.length-1, r=nc[c]-1, res=[];
  for(var k=1;k<=3;k++) res.push(derivedAt(nc,c,r,k));
  return res;
}

/* ==========================================================================
   2.5 玄學：八卦、五行、干支
   -------------------------------------------------------------------------
   全部是「可重現的推算」，不是亂數：同樣的牌路與局數，起出來的卦必定相同。
   這樣才能把它丟進同一套回測裡，跟統計策略公平比較。
   ========================================================================== */
var TRI=[
  {n:'乾',s:'☰',l:[1,1,1],e:'金',img:'天'},
  {n:'兌',s:'☱',l:[1,1,0],e:'金',img:'澤'},
  {n:'離',s:'☲',l:[1,0,1],e:'火',img:'火'},
  {n:'震',s:'☳',l:[1,0,0],e:'木',img:'雷'},
  {n:'巽',s:'☴',l:[0,1,1],e:'木',img:'風'},
  {n:'坎',s:'☵',l:[0,1,0],e:'水',img:'水'},
  {n:'艮',s:'☶',l:[0,0,1],e:'土',img:'山'},
  {n:'坤',s:'☷',l:[0,0,0],e:'土',img:'地'}
];
var GUA64=[
  ['乾為天','天澤履','天火同人','天雷無妄','天風姤','天水訟','天山遯','天地否'],
  ['澤天夬','兌為澤','澤火革','澤雷隨','澤風大過','澤水困','澤山咸','澤地萃'],
  ['火天大有','火澤睽','離為火','火雷噬嗑','火風鼎','火水未濟','火山旅','火地晉'],
  ['雷天大壯','雷澤歸妹','雷火豐','震為雷','雷風恆','雷水解','雷山小過','雷地豫'],
  ['風天小畜','風澤中孚','風火家人','風雷益','巽為風','風水渙','風山漸','風地觀'],
  ['水天需','水澤節','水火既濟','水雷屯','水風井','坎為水','水山蹇','水地比'],
  ['山天大畜','山澤損','山火賁','山雷頤','山風蠱','山水蒙','艮為山','山地剝'],
  ['地天泰','地澤臨','地火明夷','地雷復','地風升','地水師','地山謙','坤為地']
];
var GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var ZHI_E=['水','土','木','木','土','火','火','土','金','金','土','水'];
var ZODIAC=['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];
var CAIWEI=['東北','東北','正西','正西','正北','正北','正東','正東','正南','正南'];
var SHENG={'金':'水','水':'木','木':'火','火':'土','土':'金'};
var KE    ={'金':'木','木':'土','土':'水','水':'火','火':'金'};
var HETU  ={'水':'1、6','火':'2、7','木':'3、8','金':'4、9','土':'5、10'};
var LIUHE =[1,0,11,10,9,8,7,6,5,4,3,2];   // 六合：子丑 寅亥 卯戌 辰酉 巳申 午未

function triIdx(l){
  for(var i=0;i<8;i++){ var t=TRI[i].l; if(t[0]===l[0]&&t[1]===l[1]&&t[2]===l[2]) return i; }
  return 0;
}
// 體用生剋（梅花易數斷法）
function tiYong(ti,yong){
  if(SHENG[yong]===ti) return {k:'用生體', j:2,  txt:'大吉'};
  if(KE[ti]===yong)    return {k:'體剋用', j:1,  txt:'吉'};
  if(ti===yong)        return {k:'比和',   j:1,  txt:'吉'};
  if(SHENG[ti]===yong) return {k:'體生用', j:-1, txt:'小凶'};
  if(KE[yong]===ti)    return {k:'用剋體', j:-2, txt:'凶'};
  return {k:'—', j:0, txt:'平'};
}
// 以牌路起卦：最近六局，莊為陽爻、閒為陰爻，初爻最早；動爻以總局數定
function castGua(seq,total){
  if(seq.length<6) return null;
  var lines=[], i, n=seq.length;
  for(i=0;i<6;i++) lines.push(seq[n-6+i]==='B'?1:0);
  var lo=triIdx(lines.slice(0,3)), up=triIdx(lines.slice(3,6));
  var dong=(total%6)+1;
  var yongLower = dong<=3;                       // 動爻所在為用卦
  var ti  = yongLower ? TRI[up].e : TRI[lo].e;
  var yong= yongLower ? TRI[lo].e : TRI[up].e;
  var zl=lines.slice(); zl[dong-1]=zl[dong-1]?0:1;
  return {
    lines:lines, zlines:zl, lo:lo, up:up, dong:dong,
    ti:ti, yong:yong, tiUpper:yongLower, v:tiYong(ti,yong),
    name:GUA64[up][lo], zname:GUA64[triIdx(zl.slice(3,6))][triIdx(zl.slice(0,3))]
  };
}
// 日干支：1900-01-01 為甲戌日
function ganzhiDay(d){
  var days=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1900,0,1))/86400000);
  var idx=(((days+10)%60)+60)%60;
  return {idx:idx, gi:idx%10, zi:idx%12, gan:GAN[idx%10], zhi:ZHI[idx%12]};
}
function shichen(d){
  var i=Math.floor(((d.getHours()+1)%24)/2);
  return {i:i, zhi:ZHI[i], e:ZHI_E[i]};
}
// 莊屬火（紅）、閒屬水（藍）：看局辰五行生剋誰
function wuxingScore(e){
  var sB=0,sP=0;
  if(SHENG[e]==='火') sB+=2;
  if(e==='火')        sB+=2;
  if(KE[e]==='水')    sB+=1;
  if(SHENG[e]==='水') sP+=2;
  if(e==='水')        sP+=2;
  if(KE[e]==='火')    sP+=1;
  return {B:sB, P:sP};
}

/* ==========================================================================
   3. 策略
   ========================================================================== */
function dirichlet(cB,cP,strength){
  var t=cB+cP;
  return (cB + strength*PBnt) / (t + strength);
}
function sig(pB,scale){
  return {pick: pB>=0.5?'B':'P', str: clamp(Math.abs(2*pB-1)*(scale===undefined?1:scale),0,1)};
}

var STRATS=[
  { id:'prior', name:'理論基準', desc:'八副牌固定機率', w:0.9,
    fn:function(){ return {pick:'B', str:Math.abs(2*PBnt-1)}; } },

  { id:'mk1', name:'一階馬可夫', desc:'上一局 → 下一局', w:1.3,
    fn:function(ctx){
      var s=ctx.seq, n=s.length; if(n<5) return null;
      var last=s[n-1], cB=0,cP=0;
      for(var i=1;i<n;i++) if(s[i-1]===last){ if(s[i]==='B')cB++; else cP++; }
      if(cB+cP<3) return null;
      return sig(dirichlet(cB,cP,4));
    } },

  { id:'mk2', name:'二階馬可夫', desc:'上兩局 → 下一局', w:1.15,
    fn:function(ctx){
      var s=ctx.seq, n=s.length; if(n<9) return null;
      var a=s[n-2], b=s[n-1], cB=0,cP=0;
      for(var i=2;i<n;i++) if(s[i-2]===a&&s[i-1]===b){ if(s[i]==='B')cB++; else cP++; }
      if(cB+cP<3) return null;
      return sig(dirichlet(cB,cP,3));
    } },

  { id:'pat', name:'模式比對', desc:'找相同片段後續', w:1.25,
    fn:function(ctx){
      var s=ctx.seq, n=s.length; if(n<10) return null;
      for(var L=6;L>=3;L--){
        if(n<L+4) continue;
        var key=s.slice(n-L).join(''), cB=0,cP=0;
        for(var i=0;i+L<n;i++){
          if(s.slice(i,i+L).join('')===key){ if(s[i+L]==='B')cB++; else cP++; }
        }
        if(cB+cP>=3){ var r=sig(dirichlet(cB,cP,2.5)); r.str*=clamp(L/5,0.5,1.2); r.note=L+'連片段'; return r; }
      }
      return null;
    } },

  { id:'dragon', name:'跟龍', desc:'連開是否續連', w:1.35,
    fn:function(ctx){
      var runs=ctx.runs, res=ctx.runRes; if(runs.length<4) return null;
      var L=runs[runs.length-1], last=res[res.length-1];
      var atLeast=0, cont=0;
      for(var i=0;i<runs.length-1;i++){ if(runs[i]>=L){ atLeast++; if(runs[i]>=L+1) cont++; } }
      if(atLeast<2) return null;
      var p=(cont+0.5)/(atLeast+1);
      var pB = last==='B' ? p : 1-p;
      var r=sig(pB,0.95); r.note='連'+L; return r;
    } },

  { id:'chop', name:'黏跳判斷', desc:'重複 vs 反轉比例', w:1.2,
    fn:function(ctx){
      var s=ctx.seq, n=s.length; if(n<8) return null;
      var rep=0;
      for(var i=1;i<n;i++) if(s[i]===s[i-1]) rep++;
      var p=(rep+1)/(n+1), last=s[n-1];
      var pB = last==='B' ? p : 1-p;
      var r=sig(pB,0.9); r.note=p>=0.5?'偏黏':'偏跳'; return r;
    } },

  { id:'roads', name:'問路（下三路）', desc:'大眼仔／小路／曱甴路', w:1.4,
    fn:function(ctx){
      if(ctx.runs.length<5) return null;
      var a=askRoads(ctx.runs,ctx.runRes,'B'), b=askRoads(ctx.runs,ctx.runRes,'P');
      var rb=0, rp=0, ok=0;
      for(var i=0;i<3;i++){
        if(a[i]){ ok++; if(a[i]==='B') rb++; }
        if(b[i] && b[i]==='B') rp++;
      }
      if(!ok) return null;
      var d=rb-rp; if(d===0) return null;
      return {pick: d>0?'B':'P', str: clamp(Math.abs(d)/3,0,1)*0.62, note: rb+'紅 : '+rp+'紅'};
    } },

  { id:'col', name:'大路列型', desc:'本列還會不會長', w:1.1,
    fn:function(ctx){
      var runs=ctx.runs, res=ctx.runRes; if(runs.length<5) return null;
      var L=runs[runs.length-1], last=res[res.length-1];
      var ge=0, gt=0;
      for(var i=0;i<runs.length-1;i++){ if(runs[i]>=L) ge++; if(runs[i]>L) gt++; }
      if(ge<3) return null;
      var p=(gt+0.5)/(ge+1);
      var pB = last==='B' ? p : 1-p;
      var r=sig(pB,0.85); r.note='列長 '+L; return r;
    } }
];
for(var _i=0;_i<STRATS.length;_i++) STRATS[_i].school='sci';

/* ---- 對照組：與牌路完全無關的亂數基準線 ----
   種子由局數決定，所以同一局重繪必得同一結果，歷史命中率才不會每次跳動。 */
function rng32(seed){
  var t=(seed+0x6D2B79F5)|0;
  return function(){
    t=Math.imul(t^(t>>>15), t|1);
    t^=t+Math.imul(t^(t>>>7), t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function dealVal(rnd){ var r=1+((rnd()*13)|0); return r>=10?0:r; }
function quickHand(rnd){                       // 無限副牌近似，補牌規則與實牌靴相同
  var p1=dealVal(rnd), b1=dealVal(rnd), p2=dealVal(rnd), b2=dealVal(rnd);
  var pt=(p1+p2)%10, bt=(b1+b2)%10, p3=null;
  if(pt<8 && bt<8){
    if(pt<=5){ p3=dealVal(rnd); pt=(pt+p3)%10; }
    if(p3===null){ if(bt<=5) bt=(bt+dealVal(rnd))%10; }
    else{
      var d=false;
      if(bt<=2) d=true;
      else if(bt===3) d=(p3!==8);
      else if(bt===4) d=(p3>=2&&p3<=7);
      else if(bt===5) d=(p3>=4&&p3<=7);
      else if(bt===6) d=(p3>=6&&p3<=7);
      if(d) bt=(bt+dealVal(rnd))%10;
    }
  }
  return pt===bt?'T':(bt>pt?'B':'P');
}
STRATS.unshift(
  { id:'table37', name:'37 副牌同開', desc:'同時開 37 桌，取莊閒多數', w:1.0, school:'ctrl',
    fn:function(ctx){
      var rnd=rng32((ctx.seed*7919 + ctx.total*13 + 1)|0), b=0, p=0, i, g, r;
      for(i=0;i<37;i++){
        g=0; do{ r=quickHand(rnd); g++; }while(r==='T' && g<25);   // 和局重發，確保 37 票必有多數
        if(r==='B') b++; else if(r==='P') p++;
      }
      if(b===p) return null;
      return {pick:b>p?'B':'P', str:clamp(Math.abs(b-p)/10,0,1)*0.5, note:'莊 '+b+' : 閒 '+p};
    } },
  { id:'dice37', name:'37 顆骰同擲', desc:'同擲 37 顆，單數多押莊', w:1.0, school:'ctrl',
    fn:function(ctx){
      var rnd=rng32((ctx.seed*104729 + ctx.total*31 + 7)|0), odd=0, i;
      for(i=0;i<37;i++) if((1+((rnd()*6)|0))%2===1) odd++;
      var even=37-odd;                                             // 37 為奇數，單雙必不相等
      return {pick:odd>even?'B':'P', str:clamp(Math.abs(odd-even)/10,0,1)*0.5,
              note:'單 '+odd+' : 雙 '+even};
    } }
);
var USE_CTRL=false;  // 對照組預設不參與投票 —— 對照組一旦參與，就不再是對照組
function voteOn(st){
  if(st.school==='myst') return USE_MYST;
  if(st.school==='ctrl') return USE_CTRL;
  return true;
}

/* ---- 玄學組：同樣要交出命中率 ---- */
STRATS.push(
  { id:'gua', name:'梅花易數', desc:'牌路起卦・體用生剋', w:1.3, school:'myst',
    fn:function(ctx){
      var g=castGua(ctx.seq, ctx.total);
      if(!g || g.v.j===0) return null;
      var last=ctx.seq[ctx.seq.length-1];
      var pick = g.v.j>0 ? last : other(last);      // 吉則順勢，凶則反勢
      return {pick:pick, str: clamp(Math.abs(g.v.j)/2,0,1)*0.55, note:g.name+'‧'+g.v.txt};
    } },
  { id:'wuxing', name:'五行生剋', desc:'局辰旺莊火或閒水', w:1.1, school:'myst',
    fn:function(ctx){
      if(ctx.seq.length<4) return null;
      var zi=ctx.total%12, e=ZHI_E[zi], w=wuxingScore(e);
      if(w.B===w.P) return null;
      return {pick: w.B>w.P?'B':'P', str: clamp(Math.abs(w.B-w.P)/4,0,1)*0.5,
              note: ZHI[zi]+'辰‧'+e+(SHENG[e]?('生'+SHENG[e]):'') };
    } }
);
var USE_MYST=true;   // 玄學是否參與綜合投票

/* ==========================================================================
   4. 引擎：對整靴做因果推演，同時累計每個策略的實測命中
   ========================================================================== */
function runEngine(hands, seed){
  seed = seed||1;
  var seq=[], runs=[], runRes=[];
  var stat={}, i, s;
  for(i=0;i<STRATS.length;i++) stat[STRATS[i].id]={c:0,n:0};
  var en={c:0,n:0,pl:0,ev:0};
  var total=0;
  var history=[];   // 每一局的判斷紀錄
  var lastVotes=null, lastEns=null;

  function step(){
    var ctx={seq:seq, runs:runs, runRes:runRes, total:total, seed:seed};
    var votes=[], totW=0, signed=0;
    for(var j=0;j<STRATS.length;j++){
      var st=STRATS[j], v=null;
      try{ v=st.fn(ctx); }catch(e){ v=null; }
      var acc = stat[st.id].n>=6 ? stat[st.id].c/stat[st.id].n : 0.5;
      var adapt = stat[st.id].n>=6 ? clamp(1+3*(acc-0.5),0.35,2.2) : 1;
      var w = st.w*adapt;
      if(v && voteOn(st)){ totW+=w; signed += w*v.str*(v.pick==='B'?1:-1); }
      votes.push({st:st, v:v, w:w, acc:acc, n:stat[st.id].n, c:stat[st.id].c});
    }
    var raw = totW>0 ? signed/totW : 0;
    var pBn = clamp(0.5 + raw*0.9, 0.06, 0.94);
    var ens = totW>0 ? {pick: pBn>=0.5?'B':'P', pBn:pBn, conf:Math.max(pBn,1-pBn)} : null;
    return {votes:votes, ens:ens};
  }

  for(i=0;i<hands.length;i++){
    var h=hands[i];
    total=i;
    var r=step();
    if(h.r!=='T'){
      for(var j=0;j<r.votes.length;j++){
        var vv=r.votes[j];
        if(vv.v){ stat[vv.st.id].n++; if(vv.v.pick===h.r) stat[vv.st.id].c++; }
      }
      if(r.ens){
        en.n++;
        var win = r.ens.pick===h.r;
        if(win) en.c++;
        en.pl += win ? (h.r==='B'?0.95:1) : -1;
        en.ev += r.ens.pick==='B'?EDGE_B:EDGE_P;
      }
      history.push({i:i, pick:r.ens?r.ens.pick:null, actual:h.r});
      // 推進路單
      if(seq.length && seq[seq.length-1]===h.r) runs[runs.length-1]++;
      else { runs.push(1); runRes.push(h.r); }
      seq.push(h.r);
    }
  }
  total=hands.length;
  var fin=step();
  return {votes:fin.votes, ens:fin.ens, stat:stat, en:en, history:history, seq:seq, runs:runs, runRes:runRes};
}

/* ==========================================================================
   5. 牌靴模擬（真實補牌規則）
   ========================================================================== */
function val(r){ return r>=10?0:r; }
function makeShoe(decks){
  var s=new Array(decks*52), i=0, d, rk, x;
  for(d=0;d<decks;d++) for(rk=1;rk<=13;rk++) for(x=0;x<4;x++) s[i++]=rk;
  for(var j=s.length-1;j>0;j--){ var k=(Math.random()*(j+1))|0, t=s[j]; s[j]=s[k]; s[k]=t; }
  return s;
}
function playShoe(){
  var s=makeShoe(DECKS), i=0, out=[];
  var f=val(s[i++]); i += (f===0?10:f);      // 燒牌
  while(s.length-i >= CUT+6){
    var p1=s[i++], b1=s[i++], p2=s[i++], b2=s[i++];
    var pt=(val(p1)+val(p2))%10, bt=(val(b1)+val(b2))%10, p3=null;
    if(pt<8 && bt<8){
      if(pt<=5){ p3=s[i++]; pt=(pt+val(p3))%10; }
      if(p3===null){ if(bt<=5) bt=(bt+val(s[i++]))%10; }
      else{
        var v=val(p3), dr=false;
        if(bt<=2) dr=true;
        else if(bt===3) dr=(v!==8);
        else if(bt===4) dr=(v>=2&&v<=7);
        else if(bt===5) dr=(v>=4&&v<=7);
        else if(bt===6) dr=(v>=6&&v<=7);
        if(dr) bt=(bt+val(s[i++]))%10;
      }
    }
    out.push({r: pt===bt?'T':(bt>pt?'B':'P'), bp:b1===b2, pp:p1===p2});
  }
  return out;
}

  var totRem=0, cB=0, cP=0, cT=0, runs=0;
  var perB=new Array(MC_WIN), perP=new Array(MC_WIN), k;
  for(k=0;k<MC_WIN;k++){ perB[k]=0; perP[k]=0; }
  var sample=null;
  for(var s=0;s<MC_SHOES;s++){
    var sh=playShoe();
    if(sh.length<=played) { runs++; continue; }
    var rest=sh.slice(played);
    if(!sample) sample=rest;

    for(var i=0;i<rest.length;i++){

      if(r==='B')cB++; else if(r==='P')cP++; else cT++;
      if(i<MC_WIN){ if(r==='B')perB[i]++; else if(r==='P')perP[i]++; }
    }
  }
  if(!runs) runs=1;
  return {rem:totRem/runs, B:cB/runs, P:cP/runs, T:cT/runs, perB:perB, perP:perP, sample:sample};
}

   8. 回測
   ========================================================================== */
var BETSYS={
  flat:  function(){ return {next:function(u){return u;}, on:function(){}}; },
  martin:function(){ var L=0; return {next:function(u){return u*Math.pow(2,Math.min(L,6));}, on:function(w){ L=w?0:L+1; }}; },
  dalem: function(){ var d=0; return {next:function(u){return u*(1+d);}, on:function(w){ d=w?Math.max(0,d-1):d+1; }}; },
  paroli:function(){ var st=0, seqp=[1,2,4]; return {next:function(u){return u*seqp[st];}, on:function(w){ st=w?(st+1)%3:0; }}; },
  '1326':function(){ var st=0, s6=[1,3,2,6]; return {next:function(u){return u*s6[st];}, on:function(w){ st=w?(st+1)%4:0; }}; }
};

function backtest(nShoes, betKey, unit, bank0, onDone, onTick){
  var stat={}, i;
  for(i=0;i<STRATS.length;i++) stat[STRATS[i].id]={c:0,n:0,pl:0};
  var en={c:0,n:0}, bank=bank0, bust=0, curve=[0], net=0, peak=0, dd=0, hands=0;
  var prog=BETSYS[betKey]();
  var done=0;

  function chunk(){
    var end=Math.min(done+25, nShoes);
    for(var s=done;s<end;s++){
      var sh=playShoe();
      var seq=[], runs=[], runRes=[];
      var local={}; for(i=0;i<STRATS.length;i++) local[STRATS[i].id]={c:0,n:0};
      for(var hi=0;hi<sh.length;hi++){
        var h=sh[hi];
        var ctx={seq:seq,runs:runs,runRes:runRes,total:hi,seed:s+1};
        var totW=0, signed=0, vs=[];
        for(var j=0;j<STRATS.length;j++){
          var st=STRATS[j], v=null;
          try{ v=st.fn(ctx); }catch(e){ v=null; }
          var acc=local[st.id].n>=6?local[st.id].c/local[st.id].n:0.5;
          var adapt=local[st.id].n>=6?clamp(1+3*(acc-0.5),0.35,2.2):1;
          var w=st.w*adapt;
          if(v && voteOn(st)){ totW+=w; signed+=w*v.str*(v.pick==='B'?1:-1); }
          vs.push(v);
        }
        var pick = totW>0 ? (0.5+signed/totW*0.9>=0.5?'B':'P') : null;
        var bet=prog.next(unit);
        if(h.r==='T'){ hands++; continue; }              // 和局：退還
        for(j=0;j<STRATS.length;j++){
          if(vs[j]){
            local[STRATS[j].id].n++; stat[STRATS[j].id].n++;
            if(vs[j].pick===h.r){ local[STRATS[j].id].c++; stat[STRATS[j].id].c++;
              stat[STRATS[j].id].pl += h.r==='B'?0.95:1;
            } else stat[STRATS[j].id].pl -= 1;
          }
        }
        if(pick){
          en.n++;
          var win = pick===h.r;
          if(win) en.c++;
          var delta = win ? bet*(h.r==='B'?0.95:1) : -bet;
          net+=delta; bank+=delta;
          prog.on(win);
          if(bank < unit){ bust++; bank=bank0; prog=BETSYS[betKey](); }
          if(net>peak) peak=net;
          if(peak-net>dd) dd=peak-net;
        }
        hands++;
        if(hands%25===0) curve.push(net);
        if(seq.length && seq[seq.length-1]===h.r) runs[runs.length-1]++;
        else { runs.push(1); runRes.push(h.r); }
        seq.push(h.r);
      }
    }
    done=end;
    if(onTick) onTick(done/nShoes);
    if(done<nShoes) setTimeout(chunk,0);
    else onDone({stat:stat,en:en,net:net,bank:bank0+net,bust:bust,curve:curve,hands:hands,dd:dd,unit:unit});
  }
  setTimeout(chunk,0);
}

function drawCurve(res){
  var cv=$('#bankChart'), ctx=cv.getContext('2d');
  var W=cv.width, H=cv.height, pad=26;
  var cs=getComputedStyle(document.documentElement);
  var line=cs.getPropertyValue('--line').trim(), ink=cs.getPropertyValue('--ink-2').trim();
  var red=cs.getPropertyValue('--banker').trim(), grn=cs.getPropertyValue('--tie').trim();
  ctx.clearRect(0,0,W,H);
  var c=res.curve, n=c.length; if(n<2) return;
  var evEnd = res.en.n*res.unit*EDGE_B;
  var lo=Math.min(0,evEnd), hi=Math.max(0,evEnd);
  for(var i=0;i<n;i++){ if(c[i]<lo)lo=c[i]; if(c[i]>hi)hi=c[i]; }
  var span=(hi-lo)||1; lo-=span*0.1; hi+=span*0.1; span=hi-lo;
  var X=function(i){return pad+(W-pad-8)*i/(n-1);};
  var Y=function(v){return H-pad-(H-pad*1.4)*(v-lo)/span;};
  // 零軸
  ctx.strokeStyle=line; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pad,Y(0)); ctx.lineTo(W-8,Y(0)); ctx.stroke();
  // 理論期望線
  ctx.strokeStyle=ink; ctx.setLineDash([5,5]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(n-1),Y(evEnd)); ctx.stroke();
  ctx.setLineDash([]);
  // 實際曲線
  ctx.strokeStyle = res.net>=0?grn:red; ctx.lineWidth=2.2; ctx.lineJoin='round';
  ctx.beginPath();
  for(i=0;i<n;i++){ if(i===0) ctx.moveTo(X(i),Y(c[i])); else ctx.lineTo(X(i),Y(c[i])); }
  ctx.stroke();
  ctx.fillStyle=ink; ctx.font='11px "IBM Plex Mono",monospace';
  ctx.fillText('0', 6, Y(0)+4);
  ctx.fillText('理論期望', W-92, Y(evEnd)-7);
}

  var box=$('#guaBox');
  if(!g){
    box.innerHTML='<p class="hint" style="margin:0">還差 '+(6-R.seq.length)+
      ' 局（莊閒，不計和局）就能起卦。莊為陽爻、閒為陰爻，初爻在下。</p>';
  }else{
    var up=TRI[g.up], lo=TRI[g.lo];
    var cls = g.v.j>0 ? 'good' : (g.v.j<0 ? 'bad' : '');
    var last=R.seq[R.seq.length-1];
    var act = g.v.j>0 ? ('順勢跟'+CH[last]) : (g.v.j<0 ? ('逆勢押'+CH[other(last)]+'，或宜靜不宜動') : '無明顯偏向');
    box.innerHTML=
      '<div class="gua-row">'+
        guaHTML(g.lines, g.dong, false)+
        '<div class="gua-arrow">→</div>'+
        guaHTML(g.zlines, 0, true)+
        '<div class="gua-meta">'+
          '<div class="gua-name">'+g.name+'</div>'+
          '<div class="gua-sub">動'+['初','二','三','四','五','上'][g.dong-1]+'爻　之　'+g.zname+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="gua-tri">'+
        '<span class="trigram"><span class="sym">'+up.s+'</span><b>上'+up.n+'</b>'+up.img+'‧'+up.e+
          (g.tiUpper?'（體）':'（用）')+'</span>'+
        '<span class="trigram"><span class="sym">'+lo.s+'</span><b>下'+lo.n+'</b>'+lo.img+'‧'+lo.e+
          (g.tiUpper?'（用）':'（體）')+'</span>'+
      '</div>'+
      '<div class="verdict '+cls+'">'+
        '<span class="jud">'+g.v.txt+'</span>'+
        '<span class="txt"><b>'+g.v.k+'</b>　體'+g.ti+'・用'+g.yong+'<br>'+act+'</span>'+
      '</div>';
  }

  /* --- 五行局勢 --- */
  var zi=total%12, e=ZHI_E[zi], w=wuxingScore(e);
  $('#wxSvg').innerHTML=wxSvg(e);
  var rel = SHENG[e]==='火' ? (e+'生火，旺莊') : SHENG[e]==='水' ? (e+'生水，旺閒') :
            e==='火' ? '火火比和，旺莊' : e==='水' ? '水水比和，旺閒' :
            KE[e]==='水' ? (e+'剋水，閒受制') : KE[e]==='火' ? (e+'剋火，莊受制') : '五行平和';
  $('#wxText').innerHTML=
    '第 <b>'+(total+1)+'</b> 局　局辰 <b>'+ZHI[zi]+'</b>　五行屬 <b>'+e+'</b><br>'+
    rel+'<br><span style="color:var(--ink-3)">莊屬火（紅）　閒屬水（藍）</span>';
  var wb=w.B+0.5, wp=w.P+0.5, tw=wb+wp;      // 留底寬，0 分的一邊也看得見
  $('#wxBar').innerHTML=
    '<div class="b" style="flex-basis:'+(wb/tw*100)+'%">莊火 '+w.B+'</div>'+
    '<div class="p" style="flex-basis:'+(wp/tw*100)+'%">閒水 '+w.P+'</div>';

  /* --- 今日時空 --- */
  var now=new Date(), gz=ganzhiDay(now), sc=shichen(now);
  var chong=ZODIAC[(gz.zi+6)%12];
  $('#timeKv').innerHTML=
    '<dt>日干支</dt><dd><b>'+gz.gan+gz.zhi+'</b>日</dd>'+
    '<dt>目前時辰</dt><dd><b>'+sc.zhi+'</b>時　'+sc.e+'</dd>'+
    '<dt>財神方位</dt><dd><b>'+CAIWEI[gz.gi]+'</b></dd>'+
    '<dt>本日沖</dt><dd>沖<b>'+chong+'</b>　屬'+chong+'者宜避</dd>'+
    '<dt>牌桌五行</dt><dd>莊火・閒水　<span style="color:var(--ink-3)">水火既濟</span></dd>';

  /* --- 生肖時運 --- */
  var z=parseInt($('#zodiacSel').value,10);
  var fb=$('#fortBox');
  if(z<0){
    fb.innerHTML='<p class="hint" style="margin:0">選了生肖之後，這裡會算今日沖合與幸運數。</p>';
  }else{
    var isChong=((z+6)%12)===gz.zi, isHe=LIUHE[gz.zi]===z, isSame=z===gz.zi;
    var sco=50+(isHe?25:0)-(isChong?28:0)+(isSame?10:0)+((gz.idx*7+z*13)%19-9);
    sco=clamp(sco,5,95);
    var col = sco>=60?'var(--tie)':(sco>=40?'var(--ink-2)':'var(--banker)');
    var judge = isChong?'今日沖你，宜靜不宜動':(isHe?'今日六合，心緒安穩':(isSame?'值年同支，平常心':'平日'));
    fb.innerHTML=
      '<div class="kv">'+
        '<dt>今日運勢</dt><dd><b style="color:'+col+'">'+sco+'</b> / 100</dd>'+
      '</div>'+
      '<div class="fort"><i style="width:'+sco+'%;background:'+col+'"></i></div>'+
      '<div class="kv" style="margin-top:11px">'+
        '<dt>斷語</dt><dd>'+judge+'</dd>'+
        '<dt>幸運數</dt><dd><b>'+HETU[ZHI_E[z]]+'</b></dd>'+
        '<dt>宜坐方位</dt><dd><b>'+CAIWEI[gz.gi]+'</b></dd>'+
      '</div>'+
      '<p class="hint" style="margin:12px 0 0">這一欄不進投票、不影響任何機率，也不會被回測。'+
      '它存在的意義是給你一個<b>該不該上桌</b>的儀式性判斷 — 而那個判斷唯一能改善的，是你今天輸多少。</p>';
  }

  /* --- 玄學紀律 --- */
  var bad = (g && g.v.j<0) || (z>=0 && ((z+6)%12)===gz.zi);
  $('#ruleBox').innerHTML=
    '<div class="rule key"><span class="ic">止</span><span class="bd"><b>觀望是唯一不輸的一手</b>'+
      '<span>不下注的期望值是 0，押莊是 −1.06%。'+(bad?'今天卦象與生肖都在勸你收手。':'卦象未見大凶，但這條規則永遠成立。')+'</span></span></div>'+
    '<div class="rule"><span class="ic">盈</span><span class="bd"><b>贏三成就走</b>'+
      '<span>設定本金的 +30% 為止盈線，到了就離桌。神明給的要接得住。</span></span></div>'+
    '<div class="rule"><span class="ic">損</span><span class="bd"><b>輸兩成必停</b>'+
      '<span>本金 −20% 為止損線。運勢不會因為你多坐兩小時就翻轉。</span></span></div>'+
    '<div class="rule"><span class="ic">追</span><span class="bd"><b>連輸三局，停一輪</b>'+
      '<span>倍投法在回測裡是最快歸零的一種。可以去回測頁選馬丁格爾自己看。</span></span></div>'+
    '<div class="rule"><span class="ic">注</span><span class="bd"><b>單注不超過本金 2%</b>'+
      '<span>注碼越小，撐過波動的機會越大。這是唯一能被數學支持的「改運」方式。</span></span></div>';

  /* --- 科學 vs 神學 --- */
  var grp={sci:{c:0,n:0,k:0}, myst:{c:0,n:0,k:0}, ctrl:{c:0,n:0,k:0}};
  for(var i=0;i<STRATS.length;i++){
    var t=grp[STRATS[i].school], st=R.stat[STRATS[i].id];
    t.c+=st.c; t.n+=st.n; t.k++;
  }
  ['sci','myst','ctrl'].forEach(function(k){
    var g2=grp[k], id=k==='sci'?'Sci':(k==='myst'?'Myst':'Ctrl');
    $('#vs'+id).textContent  = g2.n?pct(g2.c/g2.n,1):'—';
    $('#vs'+id+'N').textContent = g2.k+' 個策略・'+g2.n+' 次判斷';
  });
}

/* ==========================================================================
   9. 主流程與事件
   ========================================================================== */
var lastR=null;
function render(){
  lastR=runEngine(state.hands, state.shoe);
  renderPredict(lastR);
  renderRoads();
  renderStats(lastR);
  try{ renderMyst(lastR); }catch(e){}
  save();
}
var projTimer=null;
function renderProjLazy(){
  clearTimeout(projTimer);
  projTimer=setTimeout(function(){ try{ renderProjection(); }catch(e){} }, 60);
}

function addHand(r){
  state.hands.push({r:r, bp:state.pendB, pp:state.pendP});
  state.pendB=false; state.pendP=false;
  $('#tglB').setAttribute('aria-pressed','false');
  $('#tglP').setAttribute('aria-pressed','false');
  ghost=[];
  render(); renderProjLazy();
  if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
}

document.querySelectorAll('.big[data-in]').forEach(function(b){
  b.addEventListener('click', function(){ addHand(b.dataset.in); });
});
$('#btnUndo').addEventListener('click', function(){
  if(!state.hands.length){ toast('沒有可撤銷的紀錄'); return; }
  var h=state.hands.pop(); ghost=[];
  render(); renderProjLazy(); toast('已撤銷 '+CH[h.r]);
});
$('#tglB').addEventListener('click', function(){
  state.pendB=!state.pendB; this.setAttribute('aria-pressed', state.pendB?'true':'false');
});
$('#tglP').addEventListener('click', function(){
  state.pendP=!state.pendP; this.setAttribute('aria-pressed', state.pendP?'true':'false');
});
$('#btnNew').addEventListener('click', function(){
  if(state.hands.length && !confirm('開新的一靴？目前這靴的 '+state.hands.length+' 局會清除。')) return;
  state.hands=[]; state.shoe++; ghost=[];
  render(); renderProjLazy(); toast('第 '+state.shoe+' 靴');
});
$('#btnUndoAll').addEventListener('click', function(){
  if(!confirm('清空本靴所有紀錄？')) return;
  state.hands=[]; ghost=[]; render(); renderProjLazy(); toast('已清空');
});

/* 分頁 */
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tabs button').forEach(function(x){ x.setAttribute('aria-selected','false'); });
    b.setAttribute('aria-selected','true');
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('on'); });
    document.getElementById('p-'+b.dataset.tab).classList.add('on');
    if(b.dataset.tab==='roads') renderRoads();
    window.scrollTo({top:0,behavior:'instant'});
  });
});

/* 貼上牌路 */
var sheet=$('#pasteSheet');
$('#btnPaste').addEventListener('click', function(){ sheet.classList.add('on'); $('#pasteBox').focus(); });
$('#pasteCancel').addEventListener('click', function(){ sheet.classList.remove('on'); });
sheet.addEventListener('click', function(e){ if(e.target===sheet) sheet.classList.remove('on'); });
$('#pasteOk').addEventListener('click', function(){
  var txt=$('#pasteBox').value, out=[], i, ch;
  // 若字串含大寫 B/P/T，視為輸出格式：小寫 b/p 是對子標記
  var strict=/[BPT]/.test(txt);
  var RES={'B':'B','莊':'B','庄':'B','荘':'B','1':'B',
           'P':'P','閒':'P','闲':'P','閑':'P','2':'P',
           'T':'T','和':'T','平':'T','0':'T','3':'T'};
  for(i=0;i<txt.length;i++){
    ch=txt[i];
    var up=ch.toUpperCase();
    if(!strict && (ch==='b'||ch==='p'||ch==='t')){ out.push({r:up,bp:false,pp:false}); continue; }
    if(strict && ch==='b' && out.length){ out[out.length-1].bp=true; continue; }
    if(strict && ch==='p' && out.length){ out[out.length-1].pp=true; continue; }
    if(RES[ch]) out.push({r:RES[ch],bp:false,pp:false});
  }
  if(!out.length){ toast('看不出牌路內容'); return; }
  if(out.length>200) out=out.slice(0,200);
  state.hands=out; ghost=[];
  sheet.classList.remove('on'); $('#pasteBox').value='';
  render(); renderProjLazy(); toast('已載入 '+out.length+' 局');
});
$('#btnCopy').addEventListener('click', function(){
  var t=$('#exportBox');
  t.select(); t.setSelectionRange(0,99999);
  try{ document.execCommand('copy'); toast('已複製'); }
  catch(e){ if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(function(){toast('已複製');}); }
});

/* 推演 */
$('#btnRoll').addEventListener('click', function(){
  var pj=renderProjection();
  if(!pj.sample || !pj.sample.length){ toast('本靴牌已用盡'); return; }
  ghost=pj.sample.slice(0,Math.min(30,pj.sample.length)).map(function(h){
    return {r:h.r,bp:h.bp,pp:h.pp,ghost:true};
  });
  renderRoads();
  toast('已推演 '+ghost.length+' 局（隨機樣本之一）');
  document.querySelector('.tabs button[data-tab="roads"]').click();
});

/* 回測 */
$('#btnSim').addEventListener('click', function(){
  var btn=this;
  var n=parseInt($('#simShoes').value,10);
  var unit=Math.max(1,parseFloat($('#simUnit').value)||100);
  var bank=Math.max(unit,parseFloat($('#simBank').value)||10000);
  var key=$('#simBet').value;
  btn.disabled=true; btn.textContent='回測中… 0%';
  backtest(n, key, unit, bank, function(res){
    btn.disabled=false; btn.textContent='開始回測';
    $('#simOut').style.display='block';
    $('#rsN').textContent=res.hands.toLocaleString();
    $('#rsAcc').textContent=res.en.n?pct(res.en.c/res.en.n,2):'—';
    $('#rsBank').innerHTML='<span class="'+(res.net>=0?'pos':'neg')+'">'+(res.net>0?'+':'')+Math.round(res.net).toLocaleString()+'</span>';
    $('#rsBust').textContent=res.bust+' 次';
    drawCurve(res);
    var evEnd=res.en.n*unit*EDGE_B;
    $('#chartCap').innerHTML='實線＝累計盈虧，虛線＝理論期望（'+Math.round(evEnd).toLocaleString()+
      '）。最大回撤 '+Math.round(res.dd).toLocaleString()+'。曲線在虛線附近上下擺動，就是這個遊戲的全部真相。';
    var rows='';
    for(var i=0;i<STRATS.length;i++){
      var st=STRATS[i], s=res.stat[st.id];
      var a=s.n?s.c/s.n:0;
      rows+='<tr><td>'+st.name+'<span class="school '+st.school+'">'+
        SCHOOL[st.school].charAt(0)+'</span></td><td>'+s.n.toLocaleString()+'</td><td>'+(s.n?pct(a,2):'—')+
        '</td><td class="'+(s.pl>=0?'pos':'neg')+'">'+(s.pl>0?'+':'')+Math.round(s.pl).toLocaleString()+'</td></tr>';
    }
    rows+='<tr class="hi"><td>綜合建議</td><td>'+res.en.n.toLocaleString()+'</td><td>'+
      (res.en.n?pct(res.en.c/res.en.n,2):'—')+'</td><td class="'+(res.net>=0?'pos':'neg')+'">'+
      (res.net>0?'+':'')+Math.round(res.net/unit).toLocaleString()+'</td></tr>';
    $('#simTable').querySelector('tbody').innerHTML=rows;
  }, function(p){
    btn.textContent='回測中… '+Math.round(p*100)+'%';
  });
});

/* 玄學 */
(function(){
  var sel=$('#zodiacSel');
  for(var i=0;i<12;i++){
    var o=document.createElement('option');
    o.value=i; o.textContent=ZODIAC[i]+'（'+ZHI[i]+'）';
    sel.appendChild(o);
  }
  try{ var sv=localStorage.getItem('bacc.zodiac'); if(sv!==null) sel.value=sv; }catch(e){}
  sel.addEventListener('change', function(){
    try{ localStorage.setItem('bacc.zodiac', this.value); }catch(e){}
    renderMyst(lastR);
  });
  var cw=$('#ctrlOn');
  try{ var cv=localStorage.getItem('bacc.ctrl'); if(cv==='1'){ cw.checked=true; USE_CTRL=true; } }catch(e){}
  cw.addEventListener('change', function(){
    USE_CTRL=this.checked;
    try{ localStorage.setItem('bacc.ctrl', this.checked?'1':'0'); }catch(e){}
    render();
    toast(this.checked?'對照組已加入投票':'對照組已退出投票');
  });
  var sw=$('#mystOn');
  try{ var mv=localStorage.getItem('bacc.myst'); if(mv==='0'){ sw.checked=false; USE_MYST=false; } }catch(e){}
  sw.addEventListener('change', function(){
    USE_MYST=this.checked;
    try{ localStorage.setItem('bacc.myst', this.checked?'1':'0'); }catch(e){}
    render();
    toast(this.checked?'玄學已加入投票':'綜合建議只採統計組');
  });
})();

/* 設定 */
function setTheme(v){
  if(v==='auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=v;
  try{ localStorage.setItem('bacc.theme', v); }catch(e){}
}
$('#themeSel').addEventListener('change', function(){ setTheme(this.value); });
$('#tglTheme').addEventListener('click', function(){
  var cur=document.documentElement.dataset.theme;
  var isDark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  var next=isDark?'light':'dark';
  setTheme(next); $('#themeSel').value=next;
});
$('#cellSel').addEventListener('change', function(){
  document.documentElement.style.setProperty('--cell', this.value+'px');
  try{ localStorage.setItem('bacc.cell', this.value); }catch(e){}
  renderRoads();
});

/* 鍵盤（桌機測試用） */
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return;
  var k=e.key.toLowerCase();
  if(k==='b') addHand('B'); else if(k==='p') addHand('P');
  else if(k==='t') addHand('T'); else if(k==='backspace'){ e.preventDefault(); $('#btnUndo').click(); }
});

/* 啟動 */
loadPrefs(); load(); render(); renderProjLazy();
})();
</script>
